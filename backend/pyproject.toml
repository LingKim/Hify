[project]
name = "hify-backend"
version = "0.1.0"
description = "Hify backend application skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "cryptography>=44.0.0,<45.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "greenlet>=3.2.0,<4.0.0",
    "httpx>=0.28.0,<1.0.0",
    "litellm>=1.79.3,<2.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "redis>=6.0.0,<7.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.11.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["app", "tests", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
